<style>
:root{
  --ground:#F4F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC; --line:#E3E7EC; --line-strong:#CDD4DC;
  --ink:#1B2430; --ink-2:#4A5566; --ink-3:#7E8899;
  --accent:#2E3A73; --accent-2:#3D5AC9; --accent-soft:#EEF1FB;
  --good:#2E7D5B; --good-soft:#E6F2EC;
  --warn:#B85E12; --warn-soft:#FBEEDD; --warn-line:#EBC79A;
  --f-edu:#4B57C4; --f-edu-soft:#ECEEFA;
  --f-ind:#0E7C86; --f-ind-soft:#E3F2F3;
  --f-aut:#7A51B0; --f-aut-soft:#F1EAF8;
  --f-ops:#5A6473; --f-ops-soft:#EDEFF2;
  --shadow:0 1px 2px rgba(20,30,48,.05),0 4px 16px rgba(20,30,48,.05);
  --shadow-lg:0 8px 40px rgba(20,30,48,.18);
}

  --ground:#0E1319; --surface:#161C24; --surface-2:#1B222C; --line:#28313D; --line-strong:#3A4552;
  --ink:#EAEEF3; --ink-2:#AEB8C6; --ink-3:#7C8798;
  --accent:#8FA0EE; --accent-2:#7E92E8; --accent-soft:#1E2740;
  --good:#5FBE8E; --good-soft:#16281F;
  --warn:#E0994A; --warn-soft:#2E2114; --warn-line:#5C4426;
  --f-edu:#8C97EC; --f-edu-soft:#1F2440;
  --f-ind:#4FBFC8; --f-ind-soft:#12292B;
  --f-aut:#B48FDC; --f-aut-soft:#241a33;
  --f-ops:#95A0B0; --f-ops-soft:#20262E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 8px 40px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#0E1319; --surface:#161C24; --surface-2:#1B222C; --line:#28313D; --line-strong:#3A4552;
  --ink:#EAEEF3; --ink-2:#AEB8C6; --ink-3:#7C8798;
  --accent:#8FA0EE; --accent-2:#7E92E8; --accent-soft:#1E2740;
  --good:#5FBE8E; --good-soft:#16281F;
  --warn:#E0994A; --warn-soft:#2E2114; --warn-line:#5C4426;
  --f-edu:#8C97EC; --f-edu-soft:#1F2440;
  --f-ind:#4FBFC8; --f-ind-soft:#12292B;
  --f-aut:#B48FDC; --f-aut-soft:#241a33;
  --f-ops:#95A0B0; --f-ops-soft:#20262E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 8px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
h1,h2,h3{margin:0;text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
.head h1{font-size:25px;font-weight:700;letter-spacing:-.01em}
.head .sub{color:var(--ink-2);font-size:13px;margin-top:5px;max-width:62ch}
.head .meta{font-size:11.5px;color:var(--ink-3);margin-top:7px}
.head .right-top{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.theme-btn{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);border-radius:8px;
  padding:7px 11px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.theme-btn:hover{border-color:var(--line-strong)}
.viewbadge{font-size:11px;padding:5px 11px;border-radius:16px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 15px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fc,var(--accent))}
.tile .fname{font-size:13px;font-weight:600;color:var(--ink);padding-left:6px;display:flex;align-items:center;gap:7px}
.tile .dot{width:9px;height:9px;border-radius:3px;background:var(--fc,var(--accent))}
.tile .big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:10px 0 2px;padding-left:6px}
.tile .big small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.tile .split{display:flex;gap:14px;padding-left:6px;margin-top:8px;font-size:12px}
.tile .split b{font-weight:600}
.sg{color:var(--good)} .sw{color:var(--warn)}
.tile .bar{height:6px;border-radius:4px;background:var(--warn-soft);margin:10px 6px 6px;overflow:hidden;display:flex}
.tile .bar i{display:block;height:100%;background:var(--good)}
.tile .money{padding-left:6px;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.alert{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px;padding:14px 16px;margin:14px 0 8px;display:flex;gap:14px;align-items:flex-start}
.alert .ic{flex:none;width:26px;height:26px;border-radius:7px;background:var(--warn);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.alert .t{font-weight:600;color:var(--warn);font-size:13.5px}
.alert .d{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.alert .d b{color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:18px 0 4px;position:sticky;top:0;z-index:5;
  background:var(--ground);padding:8px 0;border-bottom:1px solid var(--line)}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px 9px 32px;color:var(--ink);font-size:13px;font-family:inherit}
.search input:focus{outline:2px solid var(--accent-2);outline-offset:0;border-color:transparent}
.search .mag{position:absolute;left:10px;top:9px;color:var(--ink-3)}
select,.btn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--ink);font-size:12.5px;font-family:inherit}
select:focus{outline:2px solid var(--accent-2)}
.btn{display:inline-flex;gap:6px;align-items:center;font-weight:500}
.btn:hover{border-color:var(--line-strong)}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--ink-2);font-weight:500}
.count-line{font-size:12px;color:var(--ink-3);margin:12px 2px 4px}
.fundsum{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px;align-items:center}
.fundsum .hd{font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.fundsum .fs{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12px;box-shadow:var(--shadow)}
.fundsum .fs .d{width:9px;height:9px;border-radius:3px}
.fundsum .fs b{font-weight:600;font-variant-numeric:tabular-nums}
.fundsum .fs small{color:var(--ink-3)}
.badge.fund{display:inline-flex;align-items:center;gap:4px}
.field-sec{margin-top:22px}
.field-h{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px solid var(--fc,var(--accent));margin-bottom:2px}
.field-h .fdot{width:12px;height:12px;border-radius:4px;background:var(--fc)}
.field-h h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
.field-h .fc{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:auto}
.strat{margin-top:14px}
.strat-h{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;margin:8px 0 2px;padding-left:2px;
  display:flex;align-items:center;gap:8px}
.strat-h::before{content:"";width:16px;height:2px;background:var(--fc);border-radius:2px}
.task-grp{margin:6px 0 2px}
.task-h{font-size:11.5px;color:var(--ink-3);font-weight:600;margin:9px 0 5px;padding-left:20px;position:relative}
.task-h::before{content:"›";position:absolute;left:8px;color:var(--fc)}
.task-h .lk{color:var(--f-ind);font-weight:500;margin-left:6px}
.rows{display:flex;flex-direction:column;gap:7px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  display:grid;grid-template-columns:1fr auto;gap:8px 14px;box-shadow:var(--shadow);align-items:center}
.row.unbudg{border-left:3px solid var(--warn);background:linear-gradient(90deg,var(--warn-soft) 0%,var(--surface) 46%)}
.row .main{min-width:0}
.row .nm{font-weight:600;font-size:13.5px;color:var(--ink);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row .nm .code{font-size:11px;color:var(--ink-3);font-weight:500}
.row.task-only .nm{color:var(--warn);font-style:italic;font-weight:500}
.row .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.01em;white-space:nowrap}
.b-orig{background:var(--accent-soft);color:var(--accent)}
.b-good{background:var(--good-soft);color:var(--good)}
.b-warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.b-link{background:var(--f-ind-soft);color:var(--f-ind)}
.b-dept{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.row .note{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.row .right{display:flex;align-items:center;gap:12px;justify-self:end}
.row .fig{text-align:right;min-width:96px}
.row .fig .amt{font-size:14px;font-weight:600;letter-spacing:-.01em}
.row .fig .amt.zero{color:var(--warn)}
.row .fig .lbl{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.row .fig .sp{font-size:11px;color:var(--ink-3);margin-top:2px}
.empty{text-align:center;color:var(--ink-3);padding:40px;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(15,20,30,.5);display:grid;place-items:center;padding:18px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:90vh;overflow:auto}
.modal h3{font-size:15px;font-weight:700;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .body{padding:14px 18px}
.modal .foot{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.modal .foot .r{display:flex;gap:8px}
.btn.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.export-area{width:100%;min-height:300px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);white-space:pre;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);
  padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:760px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:1fr}
  .row .right{justify-self:start;width:100%;justify-content:space-between}
  .toolbar{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  });
  el.innerHTML=html;
  el.querySelectorAll(".fs").forEach(btn=>btn.onclick=()=>{ const f=btn.dataset.fund; filt.fund = filt.fund===f?"":f; document.getElementById("fFund").value=filt.fund; render(); });
}
function renderMeta(){
  const tot=programs.length, ok=programs.filter(p=>p.status==="편성").length;
  const bud=programs.reduce((a,p)=>a+(p.budget||0),0);
  document.getElementById("metaline").textContent =
    `총 ${tot}개 항목 · 예산 편성 ${ok} / 미편성 ${tot-ok} · 편성 예산 합계 ${won(bud)} · 원천: 1차년도 성과평가보고서(2026.5) + 2차년도 예산편성(안, 2026.9.10)`;
}
function renderTiles(){
  const s=summary(); const el=document.getElementById("tiles"); el.innerHTML="";
  FIELDS.forEach(f=>{
    const t=s[f]; const pct=t.total? Math.round(t.ok/t.total*100):0;
    const d=document.createElement("div"); d.className="tile";
    d.style.setProperty("--fc",`var(${FCVAR[f]})`);
    d.innerHTML=`<div class="fname"><span class="dot"></span>${f}</div>
      <div class="big tnum">${t.total}<small> 개 항목</small></div>
      <div class="split"><span class="sg tnum"><b>${t.ok}</b> 편성</span><span class="sw tnum"><b>${t.no}</b> 미편성</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="money tnum">예산 ${eok(t.budget)}원</div>`;
    d.onclick=()=>{ filt.field = filt.field===f?"":f; syncChips(); render(); window.scrollTo({top:document.querySelector('.toolbar').offsetTop-8,behavior:'smooth'}); };
    el.appendChild(d);
  });
}
function renderAlert(){
  const no=programs.filter(p=>p.status==="미편성");
  const linked=no.filter(p=>(p.linkOther||"").startsWith("O")).length;
  document.getElementById("alertText").innerHTML =
    `계획 체계에는 있으나 2026년 예산이 편성되지 않은 항목이 <b>${no.length}개</b>입니다. `+
    `이 중 <b>${linked}개</b>는 다른 재정지원사업(RISE·SCOUT 등)으로 추진되어 혁신지원 예산이 붙지 않았고, 나머지는 과제만 존재하거나 반납된 항목입니다. `+
    `아래에서 <b style="color:var(--warn)">미편성</b> 필터로 한눈에 볼 수 있습니다.`;
}
function renderList(){
  const list=document.getElementById("list"); list.innerHTML="";
  const vis=visible();
  document.getElementById("countLine").textContent = `${vis.length}개 항목 표시` + (filt.field||filt.status||filt.orig||filt.q?" (필터 적용됨)":"");
  if(!vis.length){ list.innerHTML=`<div class="empty">조건에 맞는 프로그램이 없습니다.</div>`; return; }
  FIELDS.forEach(f=>{
    const inF=vis.filter(p=>p.field2026===f); if(!inF.length) return;
    const sec=document.createElement("section"); sec.className="field-sec"; sec.style.setProperty("--fc",`var(${FCVAR[f]})`);
    const okc=inF.filter(p=>p.status==="편성").length;
    sec.innerHTML=`<div class="field-h"><span class="fdot"></span><h2>${f}</h2><span class="fc tnum">${inF.length}개 · 편성 ${okc} / 미편성 ${inF.length-okc}</span></div>`;
    const strats=[]; const smap={};
    inF.forEach(p=>{ const sk=(p.origArea||"")+"│"+(p.strategy||"(전략 미정)");
      if(!smap[sk]){smap[sk]={orig:p.origArea,strategy:p.strategy,tasks:[],tmap:{}};strats.push(sk);} });
    inF.forEach(p=>{ const sk=(p.origArea||"")+"│"+(p.strategy||"(전략 미정)"); const S=smap[sk];
      const tk=p.task||"(과제 미정)"; if(!S.tmap[tk]){S.tmap[tk]={task:tk,link:p.linkOther,items:[]};S.tasks.push(tk);} S.tmap[tk].items.push(p); });
    strats.forEach(sk=>{ const S=smap[sk];
      const sd=document.createElement("div"); sd.className="strat";
      const origTag = f==="교육혁신(통합)" ? ` <span class="badge b-orig" style="font-size:9.5px">원영역: ${S.orig}</span>` : "";
      sd.innerHTML=`<div class="strat-h">${S.strategy||"(전략 미정)"}${origTag}</div>`;
      S.tasks.forEach(tk=>{ const T=S.tmap[tk];
        const tg=document.createElement("div"); tg.className="task-grp";
        const lk = T.link && T.link.startsWith("O") ? `<span class="lk">↔ 타사업 연계 ${T.link.slice(2)}</span>` : "";
        tg.innerHTML=`<div class="task-h">${T.task}${lk}</div>`;
        const rows=document.createElement("div"); rows.className="rows";
        T.items.forEach(p=>rows.appendChild(rowEl(p)));
        tg.appendChild(rows); sd.appendChild(tg);
      });
      sec.appendChild(sd);
    });
    list.appendChild(sec);
  });
}
function rowEl(p){
  const r=document.createElement("div");
  r.className="row"+(p.status==="미편성"?" unbudg":"")+(p.kind==="task_only"?" task-only":"");
  const codeTxt = p.code? `<span class="code tnum">${p.code}</span>`:"";
  const statusBadge = p.status==="편성"
    ? `<span class="badge b-good">예산 편성</span>`
    : `<span class="badge b-warn">예산 미편성</span>`;
  const linkBadge = (p.linkOther||"").startsWith("O") ? `<span class="badge b-link">타사업 ${p.linkOther.slice(2)}</span>`:"";
  const deptBadge = p.dept? `<span class="badge b-dept">${p.dept}</span>`:"";
  const fundEls = fundsOf(p).map(fundBadge).join("");
  const noteEl = p.note? `<div class="note">${p.note}</div>`:"";
  const amtCls = p.budget>0? "":"zero";
  const spentEl = p.budget>0? `<div class="sp tnum">집행 ${eok(p.spent)} · ${Math.round((p.spent/p.budget)*100)||0}%</div>`:"";
  r.innerHTML=`<div class="main">
      <div class="nm">${p.name} ${codeTxt}</div>
      <div class="tags">${statusBadge}${fundEls}<span class="badge b-orig">${p.origArea}</span>${linkBadge}${deptBadge}</div>
      ${noteEl}
    </div>
    <div class="right">
      <div class="fig">
        <div class="amt tnum ${amtCls}">${p.budget>0?eok(p.budget)+"원":"—"}</div>
        <div class="lbl">${p.budget>0?"편성예산":"미편성"}</div>
        ${spentEl}
      </div>
    </div>`;
  return r;
}
function renderChips(){
  const el=document.getElementById("fieldChips"); el.innerHTML="";
  const all=document.createElement("button"); all.className="fchip"; all.textContent="전체 분야"; all.setAttribute("aria-pressed", !filt.field);
  all.onclick=()=>{filt.field="";syncChips();render();}; el.appendChild(all);
  FIELDS.forEach(f=>{ const b=document.createElement("button"); b.className="fchip"; b.textContent=f;
    b.setAttribute("aria-pressed", filt.field===f);
    if(filt.field===f){b.style.background=`var(${FCVAR[f]})`;b.style.borderColor=`var(${FCVAR[f]})`;b.style.color="#fff";}
    b.onclick=()=>{filt.field=filt.field===f?"":f;syncChips();render();}; el.appendChild(b); });
}
function syncChips(){ renderChips(); }
function populateOrig(){
  const set=[...new Set(programs.map(p=>p.origArea))];
  const sel=document.getElementById("fOrig"); sel.innerHTML='<option value="">원영역 전체</option>';
  set.forEach(o=>{ const op=document.createElement("option"); op.value=o; op.textContent=o; sel.appendChild(op); });
  const fs=document.getElementById("fFund");
  if(fs){ const present=new Set(); programs.forEach(p=>fundsOf(p).forEach(f=>present.add(f)));
    fs.innerHTML='<option value="">재원 전체</option>';
    FUNDS.filter(f=>present.has(f)).forEach(f=>{ const op=document.createElement("option"); op.value=f; op.textContent="재원: "+f; fs.appendChild(op); });
    fs.value=filt.fund; }
}
function toCSV(rows){
  const cols=["field2026","origArea","strategy","task","code","name","status","budget","spent","funding","dept","fundCat","linkOther","note"];
  const head=["2026분야","원영역","전략","과제","코드","프로그램","예산상태","편성예산","집행액","재원","담당부서","비목분류","타사업연계","비고"];
  const esc2=v=>{ if(Array.isArray(v)) v=v.join("+"); v=(v==null?"":String(v)).replace(/"/g,'""'); return /[",\n]/.test(v)?`"${v}"`:v;};
  return "﻿"+[head.join(","), ...rows.map(r=>cols.map(c=>esc2(r[c])).join(","))].join("\n");
}
function openExport(){
  const rows=visible();
  const root=document.getElementById("modalRoot");
  const json=JSON.stringify(rows,null,1);
  root.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true">
    <h3>내보내기 (${rows.length}개 · 현재 필터 기준)</h3>
    <div class="body">
      <div class="chipset" style="margin-bottom:10px"><button class="fchip" id="tab_json" aria-pressed="true">JSON</button><button class="fchip" id="tab_csv" aria-pressed="false">CSV (엑셀)</button></div>
      <textarea class="export-area" id="exp" readonly></textarea>
    </div>
    <div class="foot"><span style="font-size:11.5px;color:var(--ink-3)">텍스트를 복사하거나 파일로 저장하세요</span><div class="r">
      <button class="btn" id="e_close">닫기</button>
      <button class="btn" id="e_copy">복사</button>
      <button class="btn primary" id="e_file">파일로 저장</button>
    </div></div></div></div>`;
  const ta=document.getElementById("exp"); let mode="json";
  const setj=()=>{ta.value=json;mode="json";document.getElementById("tab_json").setAttribute("aria-pressed","true");document.getElementById("tab_csv").setAttribute("aria-pressed","false");};
  const setc=()=>{ta.value=toCSV(rows);mode="csv";document.getElementById("tab_csv").setAttribute("aria-pressed","true");document.getElementById("tab_json").setAttribute("aria-pressed","false");};
  setj();
  document.getElementById("tab_json").onclick=setj;
  document.getElementById("tab_csv").onclick=setc;
  const close=()=>document.getElementById("modalRoot").innerHTML="";
  document.getElementById("e_close").onclick=close;
  document.querySelector(".overlay").onclick=e=>{if(e.target===document.querySelector(".overlay"))close();};
  document.getElementById("e_copy").onclick=async()=>{ try{await navigator.clipboard.writeText(ta.value);toast("복사됨");}catch(e){ta.select();toast("선택됨 · Ctrl+C");} };
  document.getElementById("e_file").onclick=()=>{
    const fn = mode==="json"?"innovation_programs.json":"innovation_programs.csv";
    try{
      const blob=new Blob([ta.value],{type:mode==="json"?"application/json":"text/csv;charset=utf-8"});
      const url=URL.createObjectURL(blob); const a=document.createElement("a");
      a.href=url; a.download=fn; document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},500); toast("다운로드 시작");
    }catch(e){ ta.select(); toast("복사해서 저장하세요"); }
  };
}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
let toastT;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);}

document.getElementById("q").addEventListener("input",e=>{filt.q=e.target.value;render();});
document.getElementById("fStatus").addEventListener("change",e=>{filt.status=e.target.value;render();});
document.getElementById("fOrig").addEventListener("change",e=>{filt.orig=e.target.value;render();});
document.getElementById("fFund").addEventListener("change",e=>{filt.fund=e.target.value;render();});
document.getElementById("expBtn").onclick=openExport;
document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const isDark = cur? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme", isDark?"light":"dark");
};

renderChips(); populateOrig(); render();
</script>
